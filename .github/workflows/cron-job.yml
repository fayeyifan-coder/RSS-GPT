name: RSS-GPT Auto Update

on:
  schedule:
    # every 2 hours
    - cron: "0 */2 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check DeepSeek config
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          CUSTOM_MODEL: ${{ vars.CUSTOM_MODEL }}
        run: |
          echo "BASE URL:"
          echo $OPENAI_BASE_URL
          echo "MODEL:"
          echo $CUSTOM_MODEL

          if [ -z "$OPENAI_API_KEY" ]; then
            echo "ERROR: API KEY missing"
            exit 1
          fi
          echo "API KEY exists"

      - name: Run RSS generator
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          CUSTOM_MODEL: ${{ vars.CUSTOM_MODEL }}
          U_NAME: ${{ secrets.U_NAME }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
        run: |
          python main.py
          echo "Generated files:"
          ls -al docs/

      - name: Commit and push
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/ README.md README-zh.md

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Auto update RSS"
          git pull origin main --no-rebase || true
          git push origin main

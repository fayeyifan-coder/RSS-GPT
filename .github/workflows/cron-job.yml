name: RSS & Weather Auto Digest

permissions:
  contents: write # Publish only the public daily-digest.json generated by the scheduled run.

on:
  schedule:
    # 北京时间每天早上 08:15 触发 (对应 UTC 00:15)
    - cron: '15 0 * * *'
  workflow_dispatch: # 支持手动点击运行

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify public digest contract
        run: python -m unittest discover -s tests -v

      - name: Run Weather Digest
        env:
          QWEATHER_KEY: ${{ secrets.QWEATHER_KEY }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          CITY_NAME: "洛阳"
        run: |
          python main.py

      - name: Run RSS Digest Mail
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          CUSTOM_MODEL: ${{ vars.CUSTOM_MODEL }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
          U_NAME: ${{ secrets.U_NAME }}
        run: |
          python rss_digest.py

      # The checkout's other generated feeds/logs remain uncommitted.
      # Running this workflow on a feature branch never writes to main.
      - name: Publish public workspace digest
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          if [ ! -f docs/daily-digest.json ]; then
            echo "No eligible digest generated; retaining previously published snapshot."
            exit 0
          fi
          git add -- docs/daily-digest.json
          if git diff --cached --quiet; then
            echo "No daily digest update."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "chore: publish workspace daily digest"
          git push origin HEAD:main

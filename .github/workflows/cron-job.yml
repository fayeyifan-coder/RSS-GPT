name: RSS-GPT Auto Update

on:
  schedule:
    - cron: "0 */2 * * *"

  workflow_dispatch:


concurrency:
  group: rss-gpt
  cancel-in-progress: false


jobs:

  build:

    runs-on: ubuntu-latest

    permissions:
      contents: write


    steps:

    - name: Checkout
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
        clean: true


    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"
        cache: pip


    - name: Install dependencies
      run: |

        python -m pip install --upgrade pip

        pip install -r requirements.txt



    - name: Check DeepSeek config
      env:

        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

        OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}

        CUSTOM_MODEL: ${{ vars.CUSTOM_MODEL }}

      run: |

        echo "Base URL:"
        echo "$OPENAI_BASE_URL"

        echo "Model:"
        echo "$CUSTOM_MODEL"


        if [ -z "$OPENAI_API_KEY" ]; then

          echo "ERROR: OPENAI_API_KEY missing"

          exit 1

        fi



    - name: Run RSS generator
      timeout-minutes: 20

      env:

        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

        OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}

        CUSTOM_MODEL: ${{ vars.CUSTOM_MODEL }}

        U_NAME: ${{ secrets.U_NAME }}


      run: |

        echo "Start RSS generation"

        python main.py


        echo "Generated files:"

        find docs -type f | head -50



    - name: Commit generated RSS

      run: |


        git config user.name "github-actions[bot]"

        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"



        git add docs/ README*



        if git diff --cached --quiet;

        then

          echo "No changes"

          exit 0

        fi



        git commit -m "Auto update RSS"



        echo "Push..."



        git push origin main || (

          echo "Push failed, merge remote"



          git fetch origin main



          git merge origin/main --no-edit



          git push origin main

        )

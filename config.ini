[cfg]
BASE = docs
language = zh
keyword_length = 5
summary_length = 300

[sec1]
name = 国际新闻与实时动态
url = https://rss.nytimes.com/services/xml/rss/nyt/World.xml,https://rss.nytimes.com/services/xml/rss/nyt/AsiaPacific.xml,https://www.foreignaffairs.com/rss.xml
max_items = 5

[sec2]
name = 鸟类生态与前沿研究
url = https://www.sciencedaily.com/rss/plants_animals/birds.xml,https://connect.biorxiv.org/biorxiv_xml.php?subject=animal_behavior_and_cognition
filter_apply = title
filter_type = include
# 使用正则过滤仅保留鸟类/羽毛相关研究关键词
filter_rule = bird|birds|avian|plumage|nest|ornithology|tit|sparrow|eagle|hawk
max_items = 5

